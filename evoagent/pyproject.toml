[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evoagent"
version = "0.1.0"
description = "Composable self-improving agent framework: Karpathy-loop evolution, harness middleware, memory, grading, and skill learning"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["evoagent", "evoagent.*"]

[project.optional-dependencies]
harness = [
    "langchain-core>=0.3",
]
graders = [
    "langchain-core>=0.3",
]
evolution = [
    "langchain-core>=0.3",
    "langgraph>=1.0",
    "langsmith>=0.7",
]
all = [
    "evoagent[harness,graders,evolution]",
]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "mypy>=1.19",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["evoagent", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["evoagent"]

[tool.pytest.ini_options]
testpaths = ["tests/evoagent"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests with mocked LLM",
    "e2e: End-to-end tests",
]
addopts = ["--strict-markers", "--tb=short", "-q"]
